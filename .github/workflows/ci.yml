name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned by commit SHA (PRD 8.3). Bump deliberately.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Build and smoke-test the published package
        run: |
          npm pack
          mkdir /tmp/pkg && cd /tmp/pkg && npm init -y >/dev/null
          npm i "$GITHUB_WORKSPACE"/mandat-*.tgz
          npx mandat --version
          npx mandat init && npx mandat policy test
      - name: No install hooks in the published package
        run: |
          node -e "const p=require('./package.json');const s=p.scripts||{};for(const k of ['preinstall','install','postinstall','prepare'])if(s[k]){console.error('forbidden script: '+k);process.exit(1)}"
      - name: No stray files at the repository root
        run: |
          stray=$(git ls-files | grep -v / | grep -vxE '\.gitattributes|\.gitignore|LICENSE|README\.md|action\.yml|package-lock\.json|package\.json|tsconfig\.build\.json|tsconfig\.json' || true)
          if [ -n "$stray" ]; then echo "::error::Unexpected files at the repository root:"; echo "$stray"; exit 1; fi
      - name: Dogfood the scanner
        run: node bin/mandat.ts scan-config --src src --fail-on high
