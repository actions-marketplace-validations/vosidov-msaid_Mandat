name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned by commit SHA (PRD 8.3). Bump deliberately.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Build and smoke-test the published package
        run: |
          npm pack
          mkdir /tmp/pkg && cd /tmp/pkg && npm init -y >/dev/null
          npm i "$GITHUB_WORKSPACE"/mandat-*.tgz
          npx mandat --version
          npx mandat init && npx mandat policy test
      - name: No install hooks in the published package
        run: node -e "const p=require('./package.json');const s=p.scripts||{};for(const k of ['preinstall','install','postinstall','prepare'])if(s[k]){console.error('forbidden script: '+k);process.exit(1)}"
      - name: Dogfood the scanner
        run: node bin/mandat.ts scan-config --src src --fail-on high
