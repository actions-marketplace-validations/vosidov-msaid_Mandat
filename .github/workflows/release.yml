# Publishes to npm when a version tag (v1.2.3) is pushed.
# Uses npm Trusted Publishing (OIDC): no npm token is stored anywhere, and npm attaches
# provenance that links the package to this repository, workflow and commit (PRD 8.3).
# One-time setup on npmjs.com: package "mandat" -> Settings -> Trusted Publisher -> GitHub Actions,
# owner "vosidov-msaid", repository "Mandat", workflow "release.yml".
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$expected" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)"; exit 1; }
      - name: npm must support trusted publishing (>= 11.5.1)
        run: node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm publish # prepack builds dist/; provenance is added automatically
