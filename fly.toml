# fly.toml app configuration file generated for mandat-crimson-voice-3903 on 2026-11-04T10:43:20+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Mandat MCP Scanner (mandat web). Reports and rate limits are kept in memory, so run exactly one
# always-on machine: `fly scale count 1`. To deploy your own copy: `fly launch --copy-config --name <app>`.
#

app = 'mandat-crimson-voice-3903'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
